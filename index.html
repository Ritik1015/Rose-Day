<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day Bhavya ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,0.25);
  animation:pop 0.8s ease;
}

@keyframes pop{
  from{transform:scale(0.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

h1{
  color:#e60073;
  margin-bottom:10px;
}

.subtitle{
  font-size:14px;
  color:#555;
  margin-bottom:20px;
}

.roses{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin:20px 0;
}

.rose{
  font-size:42px;
  cursor:pointer;
  transition:0.3s;
}

.rose:hover{
  transform:scale(1.4) rotate(10deg);
}

.message{
  background:#fff0f5;
  border-radius:18px;
  padding:18px;
  min-height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#b30059;
  font-size:14px;
  animation:fade 0.5s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.next-btn{
  margin-top:20px;
  padding:12px 20px;
  border:none;
  border-radius:30px;
  background:#ff4d88;
  color:white;
  font-size:14px;
  cursor:pointer;
  display:none;
}

.next-btn:hover{
  background:#e60073;
}

/* Final Page */
.final{
  display:none;
  animation:fade 1s ease;
}

.final h2{
  font-size:26px;
  color:#e60073;
  margin-bottom:15px;
}

.final p{
  font-size:15px;
  color:#555;
}
</style>
</head>

<body>

<audio id="bgm" src="song.mp3" loop></audio>

<div class="card" id="page1">
  <h1>🌹 Happy Rose Day 🌹</h1>
  <p class="subtitle">For my beautiful Bhavya ❤️</p>

  <div class="roses">
    <div class="rose" onclick="selectRose('red')">🌹</div>
    <div class="rose" onclick="selectRose('pink')">🌸</div>
    <div class="rose" onclick="selectRose('yellow')">🌼</div>
    <div class="rose" onclick="selectRose('white')">🤍🌹</div>
    <div class="rose" onclick="selectRose('purple')">💜🌹</div>
    <div class="rose" onclick="selectRose('orange')">🧡🌹</div>
  </div>

  <div class="message" id="msg">
    Tap any rose, Bhavya 🌸
  </div>

  <button class="next-btn" id="nextBtn" onclick="goFinal()">Next 💖</button>
</div>

<div class="card final" id="page2">
  <h2>Bhavya ❤️</h2>
  <p>
    From the moment you came into my life,<br>
    everything became more beautiful.<br><br>
    You are my happiness,<br>
    my peace,<br>
    my forever. 💫
  </p>
  <h2 style="margin-top:20px;">I LOVE YOU 🌹</h2>
</div>

<script>
const messages = {
  red:"Red rose for my love ❤️ Bhavya, you are my heartbeat.",
  pink:"Pink rose for sweetness 🌸 Your smile is my favourite view.",
  yellow:"Yellow rose for happiness 🌼 You light up my world.",
  white:"White rose for purity 🤍 My love for you is forever true.",
  purple:"Purple rose for magic 💜 You feel like a dream.",
  orange:"Orange rose for desire 🧡 I crave you every moment."
};

function selectRose(color){
  document.getElementById("msg").innerText = messages[color];
  document.getElementById("nextBtn").style.display = "inline-block";
  document.getElementById("bgm").play();
}

function goFinal(){
  document.getElementById("page1").style.display = "none";
  document.getElementById("page2").style.display = "block";
}
</script>

</body>
</html>
